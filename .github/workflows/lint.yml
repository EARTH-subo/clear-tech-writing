name: lint

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 中文检查器自检
        run: python scripts/lint_zh.py --selftest
      - name: 英文检查器自检
        run: python scripts/lint_en.py --selftest
